version: 2

updates:
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: nixos-apple-silicon
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
